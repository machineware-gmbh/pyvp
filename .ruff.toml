target-version = "py39"
line-length = 140

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary operator (can reduce readability)
]

[lint.isort]
known-first-party = ["vcml"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
